{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | NeurAze</title>

    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Lexend', sans-serif;
            background: linear-gradient(135deg, #EAF6FF, #EDEBFF);
        }

        .container {
            width: 85%;
            max-width: 900px;
            background: rgba(255,255,255,0.55);
            backdrop-filter: blur(18px);
            border-radius: 26px;
            padding: 45px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.12);
        }

        /* LEFT SIDE */
        .left {
            width: 48%;
        }

        .left h1 {
            font-size: 36px;
            font-weight: 700;
            color: #2d2d2d;
            margin-bottom: 10px;
        }

        .left p {
            font-size: 16px;
            color: #555;
            line-height: 1.5;
        }

        /* RIGHT FORM CARD */
        .form-card {
            width: 42%;
            background: white;
            padding: 30px 32px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .form-card h2 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 18px;
            font-weight: 700;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            margin-top: 14px;
            display: block;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border-radius: 12px;
            border: 1px solid #cfd3f5;
            background: #f7f8ff;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #5c6aff;
            background: #fff;
        }

        .error {
            font-size: 12px;
            color: #d9534f;
            margin-top: 4px;
        }

        button {
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            border: none;
            background: #5C6AFF;
            color: white;
            font-size: 15px;
            margin-top: 22px;
            cursor: pointer;
            font-weight: 600;
        }

        button:hover {
            background: #4f59ff;
        }

        .bottom-text {
            display: block;
            margin-top: 12px;
            text-align: center;
            font-size: 14px;
            color: #333;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="left">
        <h1>Welcome to NeurAze</h1>
        <p>AI-powered, dyslexia-friendly learning for every student.</p>
    </div>

    <div class="form-card">
        <h2>Login to NeurAze</h2>

        <form method="POST">
            {% csrf_token %}

            {% for field in form %}
                <label>{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <div class="error">{{ field.errors|striptags }}</div>
                {% endif %}
            {% endfor %}

            <button type="submit">Login</button>
        </form>

        <a href="{% url 'accounts:signup' %}" class="bottom-text">
            Don’t have an account? Sign up
        </a>
    </div>

</div>

</body>
</html>
