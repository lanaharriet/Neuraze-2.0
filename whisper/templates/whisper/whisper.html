<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Whisper Hall - Text to Speech</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        body {
            background: linear-gradient(135deg, #EAF6FF, #EDEBFF);
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px;
        }

        h1 {
            color: #4A3AFF;
            font-size: 40px;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        p {
            color: #4b5563;
            font-size: 16px;
            margin-bottom: 20px;
        }

        textarea {
            width: 80%;
            max-width: 900px;
            height: 180px;
            font-size: 18px;
            padding: 15px;
            border-radius: 15px;
            border: 2px solid #AFA6FF;
            outline: none;
            background: #FFFFFF;
            resize: none;
        }

        .btn-group {
            margin-top: 25px;
        }

        button {
            padding: 14px 30px;
            font-size: 18px;
            background-color: #6C63FF;
            border: none;
            color: white;
            border-radius: 12px;
            cursor: pointer;
            margin: 0 10px;
            transition: 0.2s ease;
        }

        button:hover {
            background-color: #4A3AFF;
        }

        .clear-btn {
            background-color: #6C63FF;
        }

        .clear-btn:hover {
            background-color: #4A3AFF;
        }
    </style>
</head>

<body>

    <h1>Whisper Hall</h1>
    <p>Enter text below and I will read it aloud 🎧</p>

    <textarea id="ttsInput" placeholder="Type your text here..."></textarea>

    <div class="btn-group">
        <button id="speakPauseBtn" onclick="toggleSpeech()">Speak</button>
        <button class="clear-btn" onclick="clearText()">Clear</button>
    </div>

    <script>
        let speech = null;
        let isSpeaking = false;
        let isPaused = false;

        function toggleSpeech() {
            let text = document.getElementById("ttsInput").value;
            let btn = document.getElementById("speakPauseBtn");

            if (!isSpeaking) {
                if (text.trim() === "") return;

                speech = new SpeechSynthesisUtterance(text);
                speech.lang = "en-US";
                speech.rate = 1;
                speech.pitch = 1;

                speech.onend = function() {
                    isSpeaking = false;
                    isPaused = false;
                    btn.innerText = "Speak";
                };

                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(speech);

                isSpeaking = true;
                isPaused = false;
                btn.innerText = "Pause";

                // 🔥 Log activity if 100+ words
                let wordCount = text.trim().split(/\s+/).length;

                if (wordCount >= 100) {
                    fetch("/whisper/log-activity/", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "X-CSRFToken": getCookie("csrftoken")
                        },
                        body: JSON.stringify({
                            word_count: wordCount
                        })
                    });
                }

            } 
            else if (!isPaused) {
                window.speechSynthesis.pause();
                isPaused = true;
                btn.innerText = "Resume";
            } 
            else {
                window.speechSynthesis.resume();
                isPaused = false;
                btn.innerText = "Pause";
            }
        }

        function clearText() {
            window.speechSynthesis.cancel();
            document.getElementById("ttsInput").value = "";
            document.getElementById("speakPauseBtn").innerText = "Speak";
            isSpeaking = false;
            isPaused = false;
        }

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== "") {
                let cookies = document.cookie.split(";");
                for (let i = 0; i < cookies.length; i++) {
                    let cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + "=")) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    </script>

</body>
</html>
