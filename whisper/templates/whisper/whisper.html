{% extends "base.html" %}
{% load static %}
{% block content %}

<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
    body {
        font-family: 'Lexend', sans-serif;
    }

    .whisper-container {
        max-width: 900px;
        margin: 40px auto;
        background: #F6F4FF;
        padding: 50px;
        border-radius: 28px;
        text-align: center;
    }

    h1 {
        font-size: 42px;
        color: #6C63FF;
        margin-bottom: 10px;
    }

    .subtitle {
        font-size: 18px;
        color: #5A5A7A;
        margin-bottom: 40px;
    }

    .input-box {
        background: white;
        padding: 40px;
        border-radius: 25px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        margin-bottom: 30px;
    }

    .input-box h2 {
        color: #7A73FF;
        font-weight: 500;
        margin-bottom: 20px;
    }

    textarea {
        width: 100%;
        min-height: 220px;
        border-radius: 20px;
        padding: 20px;
        font-size: 22px;
        line-height: 1.9;
        letter-spacing: 0.6px;
        border: 2px solid #D4D0FF;
        font-family: 'Lexend', sans-serif;
        resize: vertical;
    }

    .btn-row {
        margin-top: 25px;
    }
    /* TOP BAR */
.top-bar {
    display: flex;
    align-items: center;
    margin-bottom: 25px;
}

/* BACK BUTTON */
.back-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    border-radius: 14px;
    background: #EAE8FF;
    color: #5C57D8;
    text-decoration: none;
    font-size: 15px;
    font-weight: 500;
    transition: 0.2s ease;
}

.back-btn:hover {
    background: #D7D4FF;
    transform: translateX(-2px);
}


    .primary-btn {
        padding: 18px 40px;
        font-size: 20px;
        background: #6C63FF;
        color: white;
        border: none;
        border-radius: 18px;
        cursor: pointer;
        transition: 0.2s;
        margin: 0 10px;
    }

    .primary-btn:hover {
        background: #584ff0;
    }

    .secondary-btn {
        padding: 18px 40px;
        font-size: 20px;
        background: #EAE8FF;
        color: #5C57D8;
        border: none;
        border-radius: 18px;
        cursor: pointer;
        transition: 0.2s;
        margin: 0 10px;
    }

    .secondary-btn:hover {
        background: #D7D4FF;
    }
</style>


<div class="whisper-container">
    <div class="top-bar">
    <a href="{% url 'hub:hub' %}" class="back-btn">
        ← Back to Hub
    </a>
</div>


    <h1>🤫 Whisper Hall</h1>
    <p class="subtitle">
        Enter text and let it be read aloud gently and clearly.
    </p>

    <div class="input-box">
        <h2>🎧 Add your text below</h2>

        <textarea
            id="ttsInput"
            placeholder="Type or paste your text here..."
            spellcheck="false"
        ></textarea>

        <div class="btn-row">
            <button id="speakPauseBtn" class="primary-btn" onclick="toggleSpeech()">
                Speak
            </button>

            <button class="secondary-btn" onclick="clearText()">
                Clear
            </button>
        </div>
    </div>

</div>

<script>
    let speech = null;
    let isSpeaking = false;
    let isPaused = false;

    function toggleSpeech() {
        const text = document.getElementById("ttsInput").value.trim();
        const btn = document.getElementById("speakPauseBtn");

        if (!isSpeaking) {
            if (!text) return;

            speech = new SpeechSynthesisUtterance(text);
            speech.lang = "en-US";
            speech.rate = 0.95;
            speech.pitch = 1;

            speech.onend = () => {
                isSpeaking = false;
                isPaused = false;
                btn.innerText = "Speak";
            };

            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(speech);

            isSpeaking = true;
            isPaused = false;
            btn.innerText = "Pause";

            // 🔥 Activity logging (100+ words)
            const wordCount = text.split(/\s+/).length;
            if (wordCount >= 100) {
                fetch("/whisper/log-activity/", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": getCookie("csrftoken")
                    },
                    body: JSON.stringify({ word_count: wordCount })
                });
            }

        } else if (!isPaused) {
            window.speechSynthesis.pause();
            isPaused = true;
            btn.innerText = "Resume";
        } else {
            window.speechSynthesis.resume();
            isPaused = false;
            btn.innerText = "Pause";
        }
    }

    function clearText() {
        window.speechSynthesis.cancel();
        document.getElementById("ttsInput").value = "";
        document.getElementById("speakPauseBtn").innerText = "Speak";
        isSpeaking = false;
        isPaused = false;
    }

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== "") {
            const cookies = document.cookie.split(";");
            for (let cookie of cookies) {
                cookie = cookie.trim();
                if (cookie.startsWith(name + "=")) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
</script>

{% endblock %}
