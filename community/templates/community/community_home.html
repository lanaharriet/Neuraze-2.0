{% extends 'base.html' %}
{% block content %}
<h1>Community</h1>

{% for p in posts %}
<div style="background:white; padding:15px; margin:10px 0; border-radius:12px;">
    <h3><a href="{% url 'community:view_post' p.id %}">{{ p.title }}</a></h3>
    <p>{{ p.content|truncatewords:20 }}</p>
    <small>
        ❤️ {{ p.total_likes }} Likes • 💬 {{ p.comments.count }} Comments
    </small>
</div>
{% empty %}
<p>No posts yet.</p>
{% endfor %}

<a href="{% url 'community:create_post' %}">
    <button style="padding:10px 20px; border-radius:10px; background:#6C63FF; color:white;">Create Post</button>
</a>
{% endblock %}
