{% extends 'base.html' %}
{% block content %}

<style>
/* FULL PAGE GRADIENT – EXACT HUB GRADIENT */
.page-wrapper {
    min-height: 100vh;
    padding: 40px 0 60px 0;
    background: linear-gradient(135deg, #EAF6FF, #EDEBFF);
}

/* MAIN CONTAINER */
.create-container {
    max-width: 800px;
    margin: auto;
    font-family: 'Lexend', sans-serif;
}

/* BACK LINK */
.back-link {
    display: inline-block;
    margin-bottom: 20px;
    padding: 8px 16px;
    background: #eef2ff;
    color: #4A3AFF;
    border-radius: 10px;
    text-decoration: none;
    font-size: 14px;
}

/* POST CARD */
.post-card {
    background: #ffffff;
    padding: 28px;
    border-radius: 20px;
    box-shadow: 0 12px 28px rgba(0,0,0,0.08);
}

.post-card h1 {
    font-size: 32px;
    margin-bottom: 20px;
    color: #111827;
}

/* INPUTS */
.input-field {
    width: 100%;
    padding: 14px 16px;
    font-size: 15px;
    border-radius: 14px;
    border: 2px solid #c7d2fe;
    font-family: 'Lexend', sans-serif;
    margin-bottom: 18px;
}

.input-field:focus {
    outline: none;
    border-color: #6C63FF;
}

.textarea-field {
    width: 100%;
    height: 220px;
    padding: 14px 16px;
    font-size: 15px;
    border-radius: 14px;
    border: 2px solid #c7d2fe;
    font-family: 'Lexend', sans-serif;
    resize: none;
    margin-bottom: 22px;
}

.textarea-field:focus {
    outline: none;
    border-color: #6C63FF;
}

/* SUBMIT BUTTON */
.submit-btn {
    padding: 12px 28px;
    background: #6C63FF;
    color: white;
    border: none;
    border-radius: 14px;
    font-size: 15px;
    cursor: pointer;
    font-family: 'Lexend', sans-serif;
}

.submit-btn:hover {
    background: #5848ff;
}
</style>

<div class="page-wrapper">

    <div class="create-container">

        <a href="{% url 'community:home' %}" class="back-link">
            ⬅ Back to Community
        </a>

        <div class="post-card">

            <h1>Create a Post</h1>

            <form method="POST">
                {% csrf_token %}

                <input 
                    type="text" 
                    name="title" 
                    placeholder="Post title"
                    class="input-field"
                    required
                >

                <textarea 
                    name="content" 
                    placeholder="Share your thoughts, questions, or ideas..."
                    class="textarea-field"
                    required
                ></textarea>

                <button type="submit" class="submit-btn">
                    Post
                </button>
            </form>

        </div>

    </div>

</div>

{% endblock %}
