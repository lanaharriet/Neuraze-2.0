{% extends 'base.html' %}
{% block content %}

<a href="{% url 'community:home' %}" 
   style="display:inline-block; padding:8px 16px; background:#E0E0FF; color:#4A3AFF;
          border-radius:8px; text-decoration:none; margin-bottom:15px;">
   ⬅ Back to Community
</a>

<h1>Create a Post</h1>

<form method="POST">
    {% csrf_token %}
    <input type="text" name="title" placeholder="Post Title" style="width:100%; padding:10px; border-radius:10px;"><br><br>
    <textarea name="content" placeholder="Write something..." 
              style="width:100%; height:200px; padding:10px; border-radius:10px;"></textarea><br><br>
    <button type="submit" style="padding:10px 20px; background:#6C63FF; color:white; border-radius:10px;">Post</button>
</form>

{% endblock %}
